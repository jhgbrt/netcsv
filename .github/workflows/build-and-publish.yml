name: Build and Publish

on:
  workflow_dispatch

permissions:
  contents: read
  id-token: write   # required for NuGet trusted publishing (OIDC)

jobs:
  build:

    runs-on: ubuntu-latest
    environment: production   # must match the environment in the nuget.org trusted publishing policy

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    - name: Package
      run: dotnet pack --no-build --configuration Release --output ./artifacts
    - name: NuGet login (OIDC -> temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not email
    - name: Publish NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
